name: Build MG GHOST APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Find Android Gradle project
        id: project
        shell: bash
        run: |
          set -e
          PROJECT_SETTINGS="$(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -not -path './.git/*' | head -n 1)"
          if [ -z "$PROJECT_SETTINGS" ]; then
            echo "ERROR: No settings.gradle or settings.gradle.kts was found."
            find . -maxdepth 4 -type f -not -path './.git/*' | sort
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: Found Gradle settings at $PROJECT_DIR but no app directory there."
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify Gradle/Java
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Locate APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK was produced."
            find app/build/outputs -type f 2>/dev/null | sort || true
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MG-GHOST-debug
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
